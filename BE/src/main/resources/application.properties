spring.application.name=demo
server.port=8080

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/U5W7D2
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Chiave HS256: minimo 32 byte. In produzione va in variabile d'ambiente.
app.jwt.secret=${JWT_SECRET:u5w7d2-vetrina-dischi-chiave-segreta-lunga-almeno-32-byte}
app.jwt.expiration-ms=3600000

# ---------- URL applicazione ----------
app.frontend-url=http://localhost:5173

# ---------- Amministratore creato all'avvio ----------
app.admin.email=${ADMIN_EMAIL:admin@vetrina.it}
app.admin.password=${ADMIN_PASSWORD:admin1234}
