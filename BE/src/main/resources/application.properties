spring.application.name=demo
server.port=8080

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/U5W7D2
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Chiave HS256: minimo 32 byte. In produzione va in variabile d'ambiente.
app.jwt.secret=${JWT_SECRET:u5w7d2-vetrina-dischi-chiave-segreta-lunga-almeno-32-byte}
# 12 ore: una sessione di lavoro in regia senza essere buttati fuori
app.jwt.expiration-ms=43200000

# ---------- URL applicazione ----------
# origini ammesse dal CORS: sviluppo locale e sito pubblicato su GitHub Pages
app.frontend-urls=http://localhost:5173,https://justmeth25.github.io

# ---------- Amministratore creato all'avvio ----------
app.admin.email=${ADMIN_EMAIL:admin@vetrina.it}
app.admin.password=${ADMIN_PASSWORD:admin1234}
