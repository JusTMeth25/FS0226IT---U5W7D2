# ---------- Profilo demo: sito pubblico su Render ----------
# Il database vive in memoria dentro il server: niente servizi esterni.
# A ogni riavvio (deploy o risveglio dopo l'inattivita') si riparte dal seed di DataInitializer.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:solco;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Segreti obbligatori: senza queste variabili d'ambiente il server non parte
app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL:admin@vetrina.it}
app.admin.password=${ADMIN_PASSWORD}

# Account di prova per i visitatori (ruolo USER)
app.demo.email=${DEMO_EMAIL:visitatore@vetrina.it}
app.demo.password=${DEMO_PASSWORD:visitatore1234}

app.frontend-urls=${FRONTEND_URLS:https://justmeth25.github.io,http://localhost:5173}
